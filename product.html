<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>পণ্য বিস্তারিত</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <div class="brand-wrapper">
        <a href="index.html" class="icon-btn">←</a>
        <span class="shop-title-text">পণ্য বিস্তারিত</span>
      </div>
      <a href="checkout.html" class="icon-btn">🛒<span class="cart-badge-count">0</span></a>
    </div>
  </header>

  <main class="container" style="margin-top:20px;">
    <div id="product-view" style="display:grid; grid-template-columns:1fr; gap:20px;">
      <!-- Main Gallery Image -->
      <div style="background:#fff; border-radius:var(--radius-md); padding:10px; border:1px solid var(--border-color);">
        <img id="main-prod-img" src="" style="width:100%; aspect-ratio:1/1; object-fit:cover; border-radius:var(--radius-sm);" alt="Product">
        <div id="img-thumbs" style="display:flex; gap:8px; margin-top:10px; overflow-x:auto;"></div>
      </div>

      <!-- Info & Variant Picker -->
      <div style="background:#fff; border-radius:var(--radius-md); padding:16px; border:1px solid var(--border-color);">
        <h1 id="prod-name" style="font-size:1.3rem; font-weight:700; margin-bottom:10px;"></h1>
        <div class="price-wrapper">
          <span id="prod-price" class="current-price" style="font-size:1.4rem;"></span>
          <span id="prod-old-price" class="old-price"></span>
        </div>

        <div id="variants-container" style="margin:20px 0;"></div>

        <div style="display:flex; align-items:center; gap:16px; margin:20px 0;">
          <span style="font-weight:700;">পরিমাণ:</span>
          <div class="qty-control-inline" style="width:120px;">
            <button id="qty-minus" class="qty-btn">-</button>
            <span id="qty-val" class="qty-val">1</span>
            <button id="qty-plus" class="qty-btn">+</button>
          </div>
        </div>

        <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
          <button id="add-to-cart-btn" class="btn btn-outline" style="height:48px; font-size:1rem;">কার্টে যোগ করুন</button>
          <button id="order-now-btn" class="btn btn-primary" style="height:48px; font-size:1rem;">অর্ডার করুন</button>
        </div>

        <div style="margin-top:30px;">
          <h3 style="font-size:1rem; font-weight:700; border-bottom:1px solid var(--border-color); padding-bottom:6px; margin-bottom:10px;">পণ্যের বিবরণ</h3>
          <div id="prod-desc" style="font-size:0.92rem; color:var(--text-dark); line-height:1.6; whitespace:pre-line;"></div>
        </div>
      </div>
    </div>
  </main>

  <script type="module">
    import { initializeStorefront, formatPrice, addToCart } from "./app.js";
    import { db, doc, getDoc } from "./firebase-config.js";

    let product = null;
    let selectedQuantity = 1;
    let selectedVariants = {};

    async function init() {
      const shop = await initializeStorefront();
      if (!shop) return;

      const prodId = window.location.search.replace('?', '').trim();
      if (!prodId) {
        window.location.href = "index.html";
        return;
      }

      const snap = await getDoc(doc(db, "shops_products", prodId));
      if (!snap.exists()) {
        document.body.innerHTML = `<div class="state-box container" style="margin-top:80px;"><div class="state-title">পণ্যটি পাওয়া যায়নি</div></div>`;
        return;
      }

      product = { id: snap.id, ...snap.data() };

      document.getElementById("prod-name").textContent = product.productName;
      document.getElementById("prod-desc").textContent = product.description || "কোনো বিবরণ দেওয়া হয়নি।";

      // Images Setup
      const imgs = product.images || ['https://via.placeholder.com/400'];
      const mainImg = document.getElementById("main-prod-img");
      mainImg.src = imgs[0];

      const thumbsContainer = document.getElementById("img-thumbs");
      thumbsContainer.innerHTML = imgs.map(src => `
        <img src="${src}" style="width:60px; height:60px; object-fit:cover; border-radius:6px; border:1px solid var(--border-color); cursor:pointer;" onclick="document.getElementById('main-prod-img').src='${src}'"/>
      `).join('');

      // Variant Setup
      renderVariants();
      recalculatePrice();

      // Quantity Listeners
      document.getElementById("qty-minus").addEventListener("click", () => {
        if (selectedQuantity > 1) {
          selectedQuantity--;
          document.getElementById("qty-val").textContent = selectedQuantity;
          recalculatePrice();
        }
      });

      document.getElementById("qty-plus").addEventListener("click", () => {
        selectedQuantity++;
        document.getElementById("qty-val").textContent = selectedQuantity;
        recalculatePrice();
      });

      // Cart & Order Buttons
      document.getElementById("add-to-cart-btn").addEventListener("click", () => {
        if (!validateVariants()) return;
        addToCart(product, getFormattedSelectedVariants(), selectedQuantity);
      });

      document.getElementById("order-now-btn").addEventListener("click", () => {
        if (!validateVariants()) return;
        addToCart(product, getFormattedSelectedVariants(), selectedQuantity);
        window.location.href = "checkout.html";
      });
    }

    function renderVariants() {
      const container = document.getElementById("variants-container");
      container.innerHTML = "";

      if (!product.variants || product.variants.length === 0) return;

      product.variants.forEach((vGroup, gIdx) => {
        let optionsHTML = vGroup.options.map((opt, oIdx) => {
          const extraText = opt.extraPrice > 0 ? ` (+${formatPrice(opt.extraPrice)})` : '';
          return `<div class="variant-chip ${oIdx === 0 ? 'selected' : ''}" data-group="${vGroup.title}" data-name="${opt.name}" data-extra="${opt.extraPrice}">${opt.name}${extraText}</div>`;
        }).join('');

        // Pre-select first option
        selectedVariants[vGroup.title] = vGroup.options[0];

        container.innerHTML += `
          <div class="variant-group">
            <div class="variant-title">${vGroup.title}:</div>
            <div class="variant-options">${optionsHTML}</div>
          </div>
        `;
      });

      // Attach event listeners to chips
      container.querySelectorAll(".variant-chip").forEach(chip => {
        chip.addEventListener("click", function() {
          const groupName = this.getAttribute("data-group");
          const name = this.getAttribute("data-name");
          const extraPrice = Number(this.getAttribute("data-extra"));

          this.parentElement.querySelectorAll(".variant-chip").forEach(c => c.classList.remove("selected"));
          this.classList.add("selected");

          selectedVariants[groupName] = { name, extraPrice };
          recalculatePrice();
        });
      });
    }

    function validateVariants() {
      if (product.variants && product.variants.length > 0) {
        for (let vGroup of product.variants) {
          if (!selectedVariants[vGroup.title]) {
            alert(`দয়া করে ${vGroup.title} নির্বাচন করুন`);
            return false;
          }
        }
      }
      return true;
    }

    function getFormattedSelectedVariants() {
      return Object.keys(selectedVariants).map(key => ({
        title: key,
        option: selectedVariants[key].name,
        extraPrice: selectedVariants[key].extraPrice
      }));
    }

    function recalculatePrice() {
      let extra = 0;
      Object.values(selectedVariants).forEach(v => extra += (v.extraPrice || 0));
      const unit = Number(product.productPrice) + extra;

      document.getElementById("prod-price").textContent = formatPrice(unit);
      if (product.productOldPrice && product.productOldPrice > product.productPrice) {
        document.getElementById("prod-old-price").textContent = formatPrice(product.productOldPrice);
      }
    }

    init();
  </script>
</body>
</html>
