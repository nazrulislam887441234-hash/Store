<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ক্যাটাগরি পণ্য</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <div class="brand-wrapper">
        <a href="categories.html" class="icon-btn">←</a>
        <span id="category-title" class="shop-title-text">ক্যাটাগরি</span>
      </div>
      <a href="checkout.html" class="icon-btn">🛒<span class="cart-badge-count">0</span></a>
    </div>
  </header>

  <main class="container" style="margin-top:20px;">
    <div id="category-products-grid" class="products-grid">
      <div class="product-card skeleton-card skeleton"></div>
    </div>
  </main>

  <script type="module">
    import { initializeStorefront, formatPrice } from "./app.js";
    import { db, collection, query, where, getDocs, doc, getDoc } from "./firebase-config.js";

    async function init() {
      const shop = await initializeStorefront();
      if (!shop) return;

      const categoryDocId = window.location.search.replace('?', '').trim();
      if (!categoryDocId) {
        window.location.href = "categories.html";
        return;
      }

      // Fetch Category Name
      const catDoc = await getDoc(doc(db, "shops_categories", categoryDocId));
      if (catDoc.exists()) {
        document.getElementById("category-title").textContent = catDoc.data().categoryName;
      }

      // Query Products matching category document ID and shopsId
      const q = query(
        collection(db, "shops_products"),
        where("shopsId", "==", shop.uid),
        where("categoryId", "==", categoryDocId),
        where("active", "==", true)
      );

      const snap = await getDocs(q);
      const container = document.getElementById("category-products-grid");
      container.innerHTML = "";

      if (snap.empty) {
        container.innerHTML = `<div class="state-box" style="grid-column:1/-1;"><div class="state-title">এই ক্যাটাগরিতে কোনো পণ্য পাওয়া যায়নি</div></div>`;
        return;
      }

      snap.forEach(docSnap => {
        const p = docSnap.data();
        container.innerHTML += `
          <div class="product-card">
            <a href="product.html?${docSnap.id}" class="product-thumb-wrapper">
              <img src="${(p.images && p.images[0]) || 'https://via.placeholder.com/200'}" class="product-thumb" alt="${p.productName}">
            </a>
            <div class="product-details">
              <a href="product.html?${docSnap.id}" class="product-title">${p.productName}</a>
              <div class="price-wrapper"><span class="current-price">${formatPrice(p.productPrice)}</span></div>
              <a href="product.html?${docSnap.id}" class="btn btn-primary" style="margin-top:auto;">বিস্তারিত দেখুন</a>
            </div>
          </div>
        `;
      });
    }
    init();
  </script>
</body>
</html>
