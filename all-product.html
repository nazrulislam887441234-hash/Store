<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>সব পণ্য</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <div class="brand-wrapper">
        <a href="index.html" class="icon-btn">←</a>
        <span class="shop-title-text">সব পণ্য</span>
      </div>
      <a href="checkout.html" class="icon-btn">🛒<span class="cart-badge-count">0</span></a>
    </div>
  </header>

  <div class="search-container">
    <div class="container" style="display:flex; gap:10px;">
      <div class="search-box" style="flex:1;">
        <span class="search-icon-inside">🔍</span>
        <input type="text" id="catalog-search" class="search-input" placeholder="খুঁজুন...">
      </div>
      <select id="sort-select" class="search-input" style="width: auto; padding: 0 12px;">
        <option value="newest">সর্বশেষ</option>
        <option value="low-high">দাম: কম থেকে বেশি</option>
        <option value="high-low">দাম: বেশি থেকে কম</option>
      </select>
    </div>
  </div>

  <main class="container" style="margin-top:20px;">
    <div id="catalog-grid" class="products-grid">
      <div class="product-card skeleton-card skeleton"></div>
    </div>
  </main>

  <script type="module">
    import { initializeStorefront, formatPrice } from "./app.js";
    import { db, collection, query, where, getDocs } from "./firebase-config.js";

    let allProducts = [];

    async function init() {
      const shop = await initializeStorefront();
      if (!shop) return;

      const q = query(
        collection(db, "shops_products"),
        where("shopsId", "==", shop.uid),
        where("active", "==", true)
      );

      const snap = await getDocs(q);
      allProducts = snap.docs.map(d => ({ id: d.id, ...d.data() }));

      // Handle query param search
      const urlParams = new URLSearchParams(window.location.search);
      const initialQ = urlParams.get('q');
      if (initialQ) {
        document.getElementById("catalog-search").value = initialQ;
      }

      renderCatalog();

      document.getElementById("catalog-search").addEventListener("input", renderCatalog);
      document.getElementById("sort-select").addEventListener("change", renderCatalog);
    }

    function renderCatalog() {
      const searchTerm = document.getElementById("catalog-search").value.toLowerCase().trim();
      const sortVal = document.getElementById("sort-select").value;

      let filtered = allProducts.filter(p => {
        const nameMatch = p.productName && p.productName.toLowerCase().includes(searchTerm);
        const catMatch = p.categoryName && p.categoryName.toLowerCase().includes(searchTerm);
        const kwMatch = Array.isArray(p.searchKeywords) && p.searchKeywords.some(k => k.toLowerCase().includes(searchTerm));
        return nameMatch || catMatch || kwMatch;
      });

      if (sortVal === "low-high") filtered.sort((a,b) => a.productPrice - b.productPrice);
      if (sortVal === "high-low") filtered.sort((a,b) => b.productPrice - a.productPrice);
      if (sortVal === "newest") filtered.reverse();

      const container = document.getElementById("catalog-grid");
      container.innerHTML = "";

      if (filtered.length === 0) {
        container.innerHTML = `<div class="state-box" style="grid-column:1/-1;"><div class="state-title">কোনো পণ্য পাওয়া যায়নি</div></div>`;
        return;
      }

      filtered.forEach(p => {
        container.innerHTML += `
          <div class="product-card">
            <a href="product.html?${p.id}" class="product-thumb-wrapper">
              <img src="${(p.images && p.images[0]) || 'https://via.placeholder.com/200'}" class="product-thumb" alt="${p.productName}">
            </a>
            <div class="product-details">
              <a href="product.html?${p.id}" class="product-title">${p.productName}</a>
              <div class="price-wrapper"><span class="current-price">${formatPrice(p.productPrice)}</span></div>
              <a href="product.html?${p.id}" class="btn btn-primary" style="margin-top:auto;">অর্ডার করুন</a>
            </div>
          </div>
        `;
      });
    }

    init();
  </script>
</body>
</html>
