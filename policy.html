<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>পলিসি</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <div class="brand-wrapper">
        <a href="index.html" class="icon-btn">←</a>
        <span id="policy-heading" class="shop-title-text">পলিসি</span>
      </div>
    </div>
  </header>

  <main class="container" style="margin-top:20px;">
    <div style="background:#fff; padding:20px; border-radius:var(--radius-md); border:1px solid var(--border-color);">
      <h1 id="policy-title" style="font-size:1.3rem; font-weight:700; margin-bottom:14px;"></h1>
      <div id="policy-body" style="font-size:0.95rem; line-height:1.7; color:var(--text-dark);"></div>
    </div>
  </main>

  <script type="module">
    import { initializeStorefront } from "./app.js";

    const policies = {
      privacy: { title: "গোপনীয়তা নীতি (Privacy Policy)", body: "আমরা আপনার তথ্যের সর্বোচ্চ নিরাপত্তা বজায় রাখি। কোনো গ্রাহকের ব্যক্তিগত তথ্য ৩য় কোনো পক্ষের কাছে বিক্রি বা শেয়ার করা হয় না।" },
      terms: { title: "ব্যবহারের শর্তাবলী (Terms & Conditions)", body: "আমাদের ওয়েবসাইট ব্যবহারের মাধ্যমে আপনি আমাদের সকল শর্তাবলী মেনে নিচ্ছেন বলে গণ্য হবে।" },
      return: { title: "রিটার্ন ও রিফান্ড নীতি (Return Policy)", body: "পণ্য গ্রহনের সময় কোনো ত্রুটি থাকলে ২৪ ঘণ্টার মধ্যে আমাদের সাথে যোগাযোগ করে রিফান্ড বা এক্সচেঞ্জ দাবি করা যাবে।" },
      delivery: { title: "ডেলিভারি নীতি (Delivery Policy)", body: "সাধারণত আমরা ঢাকার ভেতরে ২৪-৪৮ ঘণ্টা এবং ঢাকার বাইরে ২-৪ দিনের মধ্যে ডেলিভারি সম্পন্ন করে থাকি।" }
    };

    async function init() {
      await initializeStorefront();
      const params = new URLSearchParams(window.location.search);
      const type = params.get("type") || "privacy";

      const p = policies[type] || policies.privacy;
      document.getElementById("policy-heading").textContent = p.title;
      document.getElementById("policy-title").textContent = p.title;
      document.getElementById("policy-body").textContent = p.body;
    }
    init();
  </script>
</body>
</html>
